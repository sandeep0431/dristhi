<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CC4FF" />
      <stop offset="50%" stop-color="#4DA3FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="42" stroke="#4DA3FF" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="4 4" />
  <circle cx="50" cy="50" r="34" stroke="url(#blueGlow)" stroke-width="2" />
  <!-- Geological strata / borehole drill line -->
  <line x1="50" y1="18" x2="50" y2="82" stroke="#7CC4FF" stroke-width="3" filter="url(#glow)" />
  <line x1="30" y1="38" x2="70" y2="38" stroke="#4DA3FF" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="26" y1="50" x2="74" y2="50" stroke="#4DA3FF" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="34" y1="62" x2="66" y2="62" stroke="#4DA3FF" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- Drill Bit / Telemetry Node Point -->
  <circle cx="50" cy="74" r="5" fill="#42D6A4" filter="url(#glow)" />
  <circle cx="50" cy="50" r="4" fill="#7CC4FF" />
  <circle cx="50" cy="26" r="3" fill="#4DA3FF" />
</svg>
